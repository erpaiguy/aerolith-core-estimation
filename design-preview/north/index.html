<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aerolith — North comps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #12355B;
      --navy-2: #1B4F7A;
      --blue: #1B6CA8;
      --gold: #C9A227;
      --ink: #1C2A3A;
      --muted: #5B6B7C;
      --line: #D5DEE8;
      --sheet: #FFFFFF;
      --wash: #E8EEF4;
      --ribbon: #F4F7FB;
      --xl: #E9EDF2;
      --sel: #D6E8F7;
      --ok: #1F7A4D;
      --warn: #B45309;
      --danger: #B42318;
      --sans: Outfit, "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", Consolas, monospace;
      --r: 6px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #90A4B8; font-family: var(--sans); color: var(--ink); }
    .picker {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; background: #0B1C2C;
      position: sticky; top: 0; z-index: 40; align-items: center;
    }
    .picker b { color: #8BA3B8; font: 600 10px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; margin: 0 8px 0 4px; }
    .picker button {
      height: 26px; padding: 0 9px; border: 1px solid #2A4660; background: transparent;
      color: #D5DEE8; font: 500 11px/1 var(--sans); cursor: pointer; border-radius: 4px;
    }
    .picker button.on { background: #1B6CA8; color: #fff; border-color: #1B6CA8; }
    .picker.hidden { display: none; }
    .stage { padding: 16px; }
    .stage.embed { padding: 0; }
    .app { width: 1440px; height: 900px; overflow: hidden; background: var(--wash); }
    .stage.embed .app { border: 0; }

    button.ui {
      height: 28px; padding: 0 10px; border: 1px solid var(--line); background: #fff;
      font: 500 12px var(--sans); color: var(--ink); border-radius: var(--r); cursor: default;
    }
    button.ui.pri { background: var(--blue); color: #fff; border-color: var(--blue); }
    button.ui.navy { background: var(--navy); color: #fff; border-color: var(--navy); }
    button.ui.ghost { background: transparent; }

    /* Title + ribbon shell */
    .shell { height: 100%; display: flex; flex-direction: column; min-height: 0; }
    .titlebar {
      height: 36px; background: var(--navy); color: #E8EEF4; display: flex; align-items: center;
      gap: 12px; padding: 0 12px; font-size: 12px;
    }
    .mark {
      width: 22px; height: 22px; display: grid; grid-template-rows: 5px 5px 5px; gap: 2px;
    }
    .mark i { background: #C9A227; display: block; }
    .mark i:nth-child(2) { width: 70%; }
    .mark i:nth-child(3) { width: 40%; }
    .titlebar .job { font-weight: 600; }
    .titlebar .sp { flex: 1; }
    .titlebar .gold { color: var(--gold); font-family: var(--mono); font-weight: 600; font-size: 13px; }
    .rtabs {
      height: 30px; background: var(--navy-2); display: flex; align-items: flex-end; padding: 0 8px; gap: 2px;
    }
    .rtab {
      height: 26px; padding: 0 12px; border: 0; background: transparent; color: #C5D4E3;
      font: 500 12px var(--sans); border-radius: 6px 6px 0 0;
    }
    .rtab.on { background: var(--ribbon); color: var(--navy); font-weight: 600; }
    .ribbon {
      height: 76px; background: var(--ribbon); border-bottom: 1px solid var(--line);
      display: flex; align-items: stretch; padding: 8px 10px; gap: 0;
    }
    .rg { display: flex; gap: 6px; align-items: center; padding: 0 12px; border-right: 1px solid var(--line); }
    .rg .lab { font-size: 10px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; align-self: flex-end; padding-bottom: 2px; position: absolute; }
    .rg { position: relative; padding-bottom: 14px; }
    .rg button {
      height: 40px; min-width: 52px; padding: 4px 8px; border: 1px solid transparent; background: transparent;
      font: 500 11px/1.15 var(--sans); color: var(--ink); border-radius: 4px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
    }
    .rg button.on { background: #fff; border-color: var(--line); box-shadow: 0 1px 0 #fff; }
    .rg button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .formula {
      height: 28px; background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; font-size: 12px;
    }
    .formula .name {
      width: 88px; height: 100%; border-right: 1px solid var(--line); display: grid; place-items: center;
      font-family: var(--mono); font-size: 11px; background: var(--xl);
    }
    .formula .eq { width: 28px; text-align: center; color: var(--muted); font-weight: 600; }
    .formula .fx { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--ink); }
    .formula .amt { padding: 0 12px; font-family: var(--mono); color: var(--navy); font-weight: 600; }

    .work { flex: 1; min-height: 0; display: flex; background: var(--sheet); }
    .work.split { display: grid; grid-template-columns: 200px 1fr; }
    .work.tri { display: grid; grid-template-columns: 180px 1fr 280px; }
    .work.rate { display: grid; grid-template-columns: 280px 1fr; }
    .work.dash { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; background: var(--wash); }
    .tree { background: #F7F9FC; border-right: 1px solid var(--line); font-size: 12px; overflow: hidden; }
    .tree .cap { padding: 10px 12px 6px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .tree .n { padding: 6px 12px; color: var(--ink); }
    .tree .n.on { background: var(--sel); color: var(--navy); font-weight: 600; }
    .tree .n.dim { color: var(--muted); padding-left: 20px; }

    .cols, .row {
      display: grid;
      grid-template-columns: 36px 64px minmax(220px, 1fr) 56px 88px 40px 96px 108px 108px;
    }
    .cols {
      height: 24px; background: var(--xl); font: 600 10px/24px var(--sans); letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted); border-bottom: 1px solid #C9D3DE;
    }
    .cols > div, .row > div { padding: 0 8px; border-right: 1px solid #E4EAF0; overflow: hidden; white-space: nowrap; }
    .row { height: 24px; font-size: 12px; align-items: center; border-bottom: 1px solid #F0F3F7; }
    .row.head { background: #F4F7FB; font-weight: 600; }
    .row.sel { background: var(--sel); }
    .row .num { font-family: var(--mono); text-align: right; font-size: 11px; }
    .row .code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .sheet { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #fff; }

    .sheets {
      height: 28px; background: var(--xl); border-top: 1px solid var(--line);
      display: flex; align-items: stretch; padding-left: 8px;
    }
    .stab {
      padding: 0 14px; font: 500 12px/28px var(--sans); color: var(--muted); border-right: 1px solid var(--line);
      background: var(--xl);
    }
    .stab.on { background: #fff; color: var(--navy); font-weight: 600; border-top: 2px solid var(--blue); }
    .status {
      height: 22px; background: var(--navy); color: #C5D4E3; display: flex; align-items: center;
      gap: 16px; padding: 0 12px; font: 11px/1 var(--mono);
    }
    .status b { color: var(--gold); font-weight: 600; }
    .status .sp { flex: 1; }

    /* Login / owner / backstage */
    .login { height: 100%; display: grid; grid-template-columns: 420px 1fr; }
    .login-side { background: var(--navy); color: #E8EEF4; padding: 40px 36px; display: flex; flex-direction: column; }
    .login-side h1 { font-size: 32px; font-weight: 600; margin: 24px 0 8px; letter-spacing: -.03em; }
    .login-side p { color: #9BB3C9; font-size: 14px; line-height: 1.5; }
    .login-side .foot { margin-top: auto; font: 12px var(--mono); color: #6E8AA3; }
    .login-form { background: var(--wash); display: grid; place-items: center; }
    .card {
      width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 28px; box-shadow: 0 8px 24px rgba(18,53,91,.08);
    }
    .card h2 { margin: 0 0 4px; font-size: 18px; }
    .card .hint { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    .card label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
    .card input, .card select {
      width: 100%; height: 34px; border: 1px solid var(--line); border-radius: var(--r);
      padding: 0 10px; font: 13px var(--sans);
    }
    .seg { display: flex; background: var(--xl); border-radius: var(--r); padding: 3px; gap: 3px; }
    .seg span { flex: 1; text-align: center; padding: 6px; font-size: 12px; border-radius: 4px; color: var(--muted); }
    .seg span.on { background: #fff; color: var(--navy); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

    .back { height: 100%; display: grid; grid-template-columns: 260px 1fr; }
    .back-nav { background: var(--navy); color: #C5D4E3; padding: 20px 0; }
    .back-nav .who { padding: 0 20px 16px; color: #fff; font-weight: 600; }
    .back-nav .who small { display: block; font-weight: 400; color: #9BB3C9; margin-top: 4px; }
    .back-nav a { display: block; padding: 10px 20px; color: #C5D4E3; text-decoration: none; font-size: 13px; }
    .back-nav a.on { background: var(--navy-2); color: #fff; border-left: 3px solid var(--gold); }
    .back-main { background: #F7F9FC; padding: 28px 36px; overflow: hidden; }
    .back-main h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; }
    .back-main .sub { color: var(--muted); margin-bottom: 18px; font-size: 13px; }
    .file {
      display: grid; grid-template-columns: 1fr 140px 160px 72px; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 13px;
    }
    .file b { font-size: 14px; }
    .file .num { font-family: var(--mono); text-align: right; }
    .samples { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
    .sample {
      background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px;
    }
    .sample .k { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); font-weight: 600; }
    .sample h3 { margin: 6px 0 8px; font-size: 16px; }
    .sample p { margin: 0 0 12px; font-size: 12px; color: var(--muted); line-height: 1.45; }

    .kpi {
      background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
    }
    .kpi span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .kpi b { font-family: var(--mono); font-size: 20px; font-weight: 600; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h3 { margin: 0 0 12px; font-size: 13px; }
    .bar { display: grid; grid-template-columns: 110px 1fr 90px; gap: 8px; align-items: center; margin: 6px 0; font-size: 12px; }
    .bar i { display: block; height: 8px; background: var(--blue); border-radius: 4px; }
    .bar .num { font-family: var(--mono); text-align: right; font-size: 11px; }

    .canvas { background: #D7E0EA; position: relative; overflow: hidden; }
    .side { border-left: 1px solid var(--line); background: #F7F9FC; padding: 12px; font-size: 12px; min-width: 0; }
    .side h3 { margin: 0 0 10px; font-size: 13px; }
    .side table { width: 100%; border-collapse: collapse; }
    .side td { border-bottom: 1px solid var(--line); padding: 5px 0; }
    .side td.num { font-family: var(--mono); text-align: right; }
    .field { margin-bottom: 8px; }
    .field label { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .field input, .field select {
      width: 100%; height: 28px; border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; font: 12px var(--sans);
    }

    .doc {
      margin: 16px auto; width: 720px; background: #fff; min-height: 640px; padding: 36px 40px;
      box-shadow: 0 4px 24px rgba(18,53,91,.12); font-size: 12px;
    }
    .doc h1 { font-size: 20px; margin: 0 0 4px; }
    .doc .meta { color: var(--muted); margin-bottom: 16px; font-family: var(--mono); font-size: 11px; }
    .doc table { width: 100%; border-collapse: collapse; }
    .doc th, .doc td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; }
    .doc td.num, .doc th.num { text-align: right; font-family: var(--mono); }

    .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .pill.ok { background: #DCFCE7; color: var(--ok); }
    .pill.warn { background: #FEF3C7; color: var(--warn); }
    .pill.off { background: #E8EEF4; color: var(--muted); }
    .pill.live { background: #DBEAFE; color: var(--blue); }

    .settings { display: grid; grid-template-columns: 180px 1fr; height: 100%; background: #fff; }
    .snav { background: #F7F9FC; border-right: 1px solid var(--line); padding: 12px 0; }
    .snav a { display: block; padding: 8px 14px; font-size: 13px; color: var(--muted); }
    .snav a.on { color: var(--navy); font-weight: 600; background: var(--sel); }
    .sbody { padding: 20px 24px; }
    .sbody h2 { margin: 0 0 12px; font-size: 18px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.data th { text-align: left; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 8px; background: var(--xl); }
    table.data td { border-bottom: 1px solid #F0F3F7; padding: 7px 8px; }
    table.data td.num { font-family: var(--mono); text-align: right; }
    table.data tr.sel td { background: var(--sel); }
  </style>
</head>
<body>
  <div class="picker" id="picker">
    <b>North</b>
    <button data-s="login">Login</button>
    <button data-s="owner">Owner</button>
    <button data-s="home">Home</button>
    <button data-s="dashboard">Dashboard</button>
    <button data-s="source">Source</button>
    <button data-s="takeoff">Take-off</button>
    <button data-s="estimate">Estimate</button>
    <button data-s="analysis">Rate</button>
    <button data-s="queries">Queries</button>
    <button data-s="buy">Buy</button>
    <button data-s="compare">Compare</button>
    <button data-s="submit">Submit</button>
    <button data-s="masters">Masters</button>
    <button data-s="settings">Settings</button>
  </div>
  <div class="stage" id="stage"><div class="app" id="app"></div></div>
<script>
const params = new URLSearchParams(location.search);
let screen = params.get("s") || "estimate";
if (params.get("embed") === "1") {
  document.getElementById("picker").classList.add("hidden");
  document.getElementById("stage").classList.add("embed");
}

const svg = {
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12"/><path d="M4 16V4h12"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  print: '<svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 17H4a2 2 0 0 1-2-2v-4h20v4a2 2 0 0 1-2 2h-2"/><rect x="6" y="13" width="12" height="8"/></svg>',
  line: '<svg viewBox="0 0 24 24"><path d="M4 18 20 6"/></svg>',
  area: '<svg viewBox="0 0 24 24"><path d="M5 7h10l4 10H9z"/></svg>',
  count: '<svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="2"/><circle cx="16" cy="8" r="2"/><circle cx="16" cy="16" r="2"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="M4 12h16M13 6l7 6-7 6"/></svg>',
  seal: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M9 12l2 2 4-4"/></svg>',
  grid: '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2m-7 0 1 12h6l1-12"/></svg>',
};

const rows = [
  ["h","B1","BILL 1 — SUBSTRUCTURE","","","","","",""],
  ["","2.1","Excavate to reduced levels","m3","1,842.00","","18.50","34,077.00"],
  ["","2.2","Excavate foundation trenches","m3","416.50","","22.00","9,163.00"],
  ["s","2.3","Plain concrete blinding 1:3:6","m3","128.40","T","185.00","23,754.00"],
  ["","2.4","Reinforced concrete foundations","m3","286.00","T","420.00","120,120.00"],
  ["","2.5","Formwork to sides of foundations","m2","612.00","","28.00","17,136.00"],
  ["","2.6","High tensile reinforcement to foundations","t","42.80","T","4,850.00","207,580.00"],
  ["h","B2","BILL 2 — SUPERSTRUCTURE","","","","","",""],
  ["","3.1","Reinforced concrete columns","m3","198.60","T","465.00","92,349.00"],
  ["","3.2","Reinforced concrete beams","m3","246.40","T","445.00","109,648.00"],
  ["","3.3","Solid RC slabs 200mm","m3","512.00","T","390.00","199,680.00"],
  ["","3.4","Formwork to soffit of slabs","m2","2,560.00","","32.00","81,920.00"],
  ["","3.5","High tensile reinforcement to superstructure","t","118.40","T","4,850.00","574,240.00"],
  ["","3.6","Blockwork 200mm to external walls","m2","3,210.00","","85.00","272,850.00"],
  ["h","B3","BILL 3 — FINISHES","","","","","",""],
  ["","4.1","Ceramic floor tiles 600×600","m2","8,420.00","","95.00","799,900.00"],
  ["","4.2","Gypsum board suspended ceiling","m2","7,860.00","","62.00","487,320.00"],
  ["","4.3","Emulsion paint to walls three coats","m2","12,440.00","","18.00","223,920.00"],
  ["","4.4","Aluminium windows powder coated","m2","1,186.00","","640.00","759,040.00"],
  ["","4.5","Fire-rated timber doors 1hr","nr","86.00","","2,450.00","210,700.00"],
  ["","4.6","Stainless steel balustrades","m","412.00","","380.00","156,560.00"],
  ["h","B4","BILL 4 — SERVICES","","","","","",""],
  ["","5.1","Electrical installation complete","item","1.00","","4,280,000.00","4,280,000.00"],
  ["","5.2","HVAC VRV system","item","1.00","","6,140,000.00","6,140,000.00"],
  ["","5.3","Fire fighting & detection","item","1.00","","1,860,000.00","1,860,000.00"],
];

function grid(sel="2.3") {
  return rows.map(([type, code, desc, unit, qty, tk, rate, amt]) => `
    <div class="row ${type==="h"?"head":code===sel?"sel":""}">
      <div></div><div class="code">${code}</div><div>${desc}</div>
      <div>${unit}</div><div class="num">${qty}</div><div>${tk||""}</div>
      <div class="num">${rate||""}</div><div class="num">${amt||""}</div><div class="num">${amt||""}</div>
    </div>`).join("");
}

function mark() { return `<div class="mark"><i></i><i></i><i></i></div>`; }

const TABS = [
  ["dashboard","Dashboard"],["source","Source"],["takeoff","Take-off"],["estimate","Estimate"],
  ["analysis","Rate"],["queries","Queries"],["buy","Buy"],["submit","Issue"],["masters","Data"],["settings","File"]
];

function title(job=true) {
  return `<div class="titlebar">
    ${mark()}
    <span style="font-weight:600;letter-spacing:.04em">AEROLITH</span>
    ${job ? `<span class="job">Al Maha Campus — Lusail</span><span style="color:#9BB3C9">r03 · Trial 11d</span>` : `<span>Workspace</span>`}
    <span class="sp"></span>
    ${job ? `<span class="gold">QAR 100,826,297.13</span>` : ""}
    <span>HS · admin</span>
  </div>`;
}

function rtabs(active) {
  const map = { compare:"buy", analysis:"analysis" };
  const on = map[active] || active;
  return `<div class="rtabs">${TABS.map(([id,l]) => `<button class="rtab ${id===on?"on":""}">${l}</button>`).join("")}</div>`;
}

function ribbon(s) {
  const g = (label, btns) => `<div class="rg">${btns}<span class="lab">${label}</span></div>`;
  const b = (ico, lab, on="") => `<button class="${on}">${svg[ico]||""}<span>${lab}</span></button>`;
  if (s==="estimate") return g("Clipboard", b("copy","Copy")+b("plus","Item")) + g("Structure", b("plus","Section")+b("trash","Delete")) + g("Bills", `<button class="on"><span style="font-size:13px;font-weight:600">B1</span><span>This bill</span></button><button><span style="font-size:13px">B2</span><span>Residential</span></button><button><span style="font-size:13px">B3</span><span>Commercial</span></button>`) + g("Protect", b("lock","Source lock"));
  if (s==="takeoff") return g("Tools", b("line","Line")+b("area","Area","on")+b("count","Count")) + g("Scale", `<button><span style="font-weight:600">1:100</span><span>Sheet</span></button>`) + g("Link", b("grid","To item"));
  if (s==="analysis") return g("Item", `<button class="on"><span style="font-weight:600">2.3</span><span>Blinding</span></button>`+b("copy","Copy rate")) + g("Build-up", b("plus","Resource")+b("grid","Link"));
