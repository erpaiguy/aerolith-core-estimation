[package]
name = "aerolith-core"
version = "0.1.0"
description = "Aerolith Core Estimation"
authors = ["Aerolith"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "aerolith_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
