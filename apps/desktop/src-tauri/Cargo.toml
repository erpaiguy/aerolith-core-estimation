[package]
name = "aerolith-core"
version = "1.3.1"
description = "Bid Craft"
authors = ["Aerolith"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "aerolith_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
