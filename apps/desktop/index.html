<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bid Craft</title>
    <script>
      try {
        var theme = localStorage.getItem("bidcraft.theme");
        var style = localStorage.getItem("bidcraft.themeStyle");
        var known = { minimal: 1, spreadsheet: 1, modern: 1, cards: 1, enterprise: 1 };
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.style = known[style] ? style : "minimal";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <p style="font-family: Outfit, 'Segoe UI', system-ui, sans-serif; padding: 48px; color: #12355B; max-width: 40em;">
        Starting Bid Craft… If this message stays on screen, the preview
        server is not running. In Cursor, open the Terminal panel and run
        <code>npm run dev</code>, then open
        <strong>http://localhost:5173</strong> in Chrome or Edge.
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
